[package]
name = "snap-craft"
version = "0.2.1"
description = "SnapCraft - A premium cross-platform screenshot tool"
authors = ["you"]
edition = "2021"
# 与 `[[bin]]` 并存时，需显式指定 `cargo run` 的默认目标，否则 Tauri 开发模式会报无法选择二进制。
default-run = "snap-craft"

[lib]
name = "snap_craft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
xcap = "0.9"
arboard = "3"
image = "0.25"

# macOS 系统原生 OCR：Apple Vision 框架（编译期绑定，终端用户无需任何额外工具）。
# Windows 侧不加依赖——用系统自带 PowerShell 5.1 子进程调 WinRT Windows.Media.Ocr。
[target.'cfg(target_os = "macos")'.dependencies]
apple-vision = "0.16"
# macOS App Store 沙箱截屏：ScreenCaptureKit（SCScreenshotManager / SCShareableContent）。
# 沙箱内禁止 spawn 外部 screencapture CLI，故 App Store 构建走 ScreenCaptureKit（纯框架调用、
# 沙箱可用）；开发者 ID 构建仍走 screencapture（见 capture.rs 的运行时 is_sandboxed 分流）。
# 这些 crate 仅 macOS 编译，Windows/Linux 不引入（xcap 原生截屏）。
objc2-screen-capture-kit = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-uniform-type-identifiers = "0.3"
block2 = "0.6"

# Windows Microsoft Store 订阅 IAP（Windows.Services.Store）—— 仅 Windows 编译。
# 锁定 windows 0.61 与 biosphere 一致：0.62 会与 tauri 传递的 windows-core 0.61
# 形成两份 windows-core 导致 trait 约束冲突（HSTRING: RuntimeType not satisfied）。
# windows 0.61 把 IIterable 移到了独立 crate windows-collections 0.2，需显式依赖。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Services_Store",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
windows-collections = "0.2"

# ============================================================
# [patch] apple-vision 0.16.7 —— 修复 CI 跨 SDK 编译阻断
# ------------------------------------------------------------
# 原 crate 的 build.rs 无条件 `swift build` 整个 swift-bridge 包，其中
# SegmentationOpticalFlowCoreML.swift 用到 `Float16(bitPattern:)`，该初始化器
# 仅在最新 SDK（Xcode 26 / macOS 26）提供；GitHub macOS runner 实际供给的
# SDK（Xcode 16 / macOS 15）缺失此 API → swift build 失败 → 所有 macOS
# `cargo build` / `tauri build` 挂。`macos-26` runner 标签并未稳定提供该 SDK，
# 故仅靠 pin runner 不可靠。
# 此处 vendored 一份源码，仅把该处改为 SDK 无关写法（unsafeBitCast），
# 使 apple-vision 在任意 macOS SDK 上都能编译。本地开发环境（macOS 26 SDK）
# 仍 100% 等价；OCR 功能（recognize_text）零变化。
# ============================================================
[patch.crates-io]
apple-vision = { path = "vendor/apple-vision-0.16.7" }
