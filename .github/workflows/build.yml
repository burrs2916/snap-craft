name: CI / Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # TypeScript type-check (frontend quality gate)
  # ============================================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsc type-check
        run: pnpm exec tsc --noEmit

  # ============================================================
  # Rust check (backend quality gate)
  # ============================================================
  cargo-check:
    name: Cargo Check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  # ============================================================
  # Tauri Build Matrix (macOS / Windows)
  # ============================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: [typecheck, cargo-check]
    permissions:
      contents: write
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- Node.js + pnpm ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ---- Rust ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache Cargo (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ---- Build Tauri App ----
      # macOS: tauri-action builds and creates DMG, then we fix signing below
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'SnapCraft v__VERSION__'
          releaseBody: |
            ## SnapCraft v__VERSION__

            ### macOS (Apple Silicon)
            Download `SnapCraft_*.dmg`, double-click to mount, then drag
            **SnapCraft** into the Applications folder.
            If macOS reports the app is "damaged", run in Terminal:
            `sudo xattr -dr com.apple.quarantine /Applications/SnapCraft.app`
            On first screenshot, SnapCraft will automatically request **Screen
            Recording** permission via a system dialog. Click "Allow".

            ### Windows
            Download `SnapCraft_*.msi` and double-click to install.
            SmartScreen may warn - choose "More info -> Run anyway".
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          args: --target ${{ matrix.target }}

      # ---- macOS: fix Gatekeeper "damaged" issue ----
      # tauri-action 已经生成了 DMG 并上传到 release，但那个 DMG 里的 .app 带 quarantine。
      # 这里：1) 修复 .app 签名  2) 重新打 DMG  3) 删除旧 asset  4) 上传新 asset
      - name: Fix macOS Gatekeeper "damaged" issue
        if: startsWith(matrix.platform, 'macOS')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$BUNDLE_DIR/macos/SnapCraft.app"
          OLD_DMG="$BUNDLE_DIR/dmg/SnapCraft_0.1.0_aarch64.dmg"
          NEW_DMG="$BUNDLE_DIR/dmg/SnapCraft-fixed.dmg"

          echo "=== Before fix ==="
          xattr -l "$APP" || true
          codesign -dv "$APP" 2>&1 || true

          # 1. 去掉所有扩展属性（quarantine 是关键）
          xattr -cr "$APP"

          # 2. 重新做 ad-hoc 签名
          codesign --force --deep --sign - "$APP"

          # 3. 验证签名
          echo "=== After fix ==="
          codesign --verify --verbose "$APP" 2>&1
          xattr -l "$APP" || echo "(no extended attributes - good)"

          # 4. 重新打 DMG（覆盖旧的）
          echo "=== Rebuilding DMG ==="
          rm -f "$NEW_DMG"
          hdiutil create -volname "SnapCraft" -srcfolder "$APP" -ov -format UDZO "$NEW_DMG"

          # 5. 如果旧 DMG 存在则替换
          if [ -f "$OLD_DMG" ]; then
            mv "$NEW_DMG" "$OLD_DMG"
            echo "Replaced DMG at $OLD_DMG"
          else
            echo "Warning: expected DMG not found at $OLD_DMG, new DMG at $NEW_DMG"
          fi

          # 6. 如果在 release 模式（tag push），删除旧的 release asset 并上传新的
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Updating release assets for tag $TAG"
            # 删除旧 asset（如果存在）
            gh release delete-asset "$TAG" "SnapCraft_0.1.0_aarch64.dmg" --yes 2>/dev/null || true
            # 上传新 asset
            gh release upload "$TAG" "$OLD_DMG" --clobber
          fi

      # ---- Upload build artifacts ----
      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
