name: CI / Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # TypeScript type-check (frontend quality gate)
  # ============================================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsc type-check
        run: pnpm exec tsc --noEmit

  # ============================================================
  # Rust check (backend quality gate)
  # ============================================================
  cargo-check:
    name: Cargo Check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  # ============================================================
  # Tauri Build Matrix (macOS / Windows)
  # ============================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: [typecheck, cargo-check]
    permissions:
      contents: write
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- Node.js + pnpm ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ---- Rust ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache Cargo (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ---- Build & Bundle with tauri-action ----
      # macOS uses ad-hoc signing (tauri.conf.json: signingIdentity: "-"),
      # so NO Apple certificate / notarization is required in CI.
      # Do NOT set APPLE_* env vars here - empty values trigger notarization
      # and break the DMG bundling step.
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'SnapCraft v__VERSION__'
          releaseBody: |
            ## SnapCraft v__VERSION__

            ### macOS (Apple Silicon)
            Download `SnapCraft_*.dmg`, double-click to mount, then drag
            **SnapCraft** into the Applications folder.
            First launch may be blocked by Gatekeeper (ad-hoc signed):
            right-click -> **Open**, or run once:
            `sudo xattr -dr com.apple.quarantine /Applications/SnapCraft.app`
            On first screenshot, SnapCraft will automatically request **Screen
            Recording** permission via a system dialog. Simply click "Allow".
            If the dialog doesn't appear, go to System Settings > Privacy &
            Security > Screen Recording and enable SnapCraft manually.

            ### Windows
            Download `SnapCraft_*.msi` and double-click to install. Unsigned build,
            so SmartScreen may warn - choose "More info -> Run anyway".
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          args: --target ${{ matrix.target }}

      # ---- Upload build artifacts ----
      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
