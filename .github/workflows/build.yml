name: CI / Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # TypeScript type-check (frontend quality gate)
  # ============================================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsc type-check
        run: pnpm exec tsc --noEmit

  # ============================================================
  # Rust check (backend quality gate)
  # ============================================================
  cargo-check:
    name: Cargo Check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check
        run: cargo check --locked
        working-directory: src-tauri

      - name: Cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

  # ============================================================
  # Tauri Build Matrix (macOS / Windows)
  # ============================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: [typecheck, cargo-check]
    permissions:
      contents: write
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- Node.js + pnpm ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ---- Rust ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache Cargo (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ---- Build Tauri App ----
      # macOS 签名+公证：当配置了 Apple 证书 secrets 时自动启用
      # Windows 签名：当配置了证书 secrets 时自动启用
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名：tauri-action 自动检测这些环境变量并启用签名+公证
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_TEAM_ID && 'Developer ID Application' || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名：tauri-action 自动检测并启用
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'SnapCraft v__VERSION__'
          releaseBody: |
            ## SnapCraft v__VERSION__

            ### macOS (Apple Silicon)
            Download `SnapCraft_*.dmg`, double-click to mount, then drag
            **SnapCraft** into the Applications folder.

            如果应用使用了 Apple Developer ID 签名 + 公证（CI 配置了证书时），
            Gatekeeper 不会拦截，可直接双击打开。否则使用 ad-hoc 签名，首次
            打开需执行：
            ```bash
            sudo xattr -dr com.apple.quarantine /Applications/SnapCraft.app
            ```
            首次截图时会自动弹出屏幕录制权限请求，点击「允许」即可。

            ### Windows (Installer)
            Download `SnapCraft_*.msi` and double-click to install.
            SmartScreen may warn - choose "More info -> Run anyway".

            ### Windows (Standalone EXE)
            Download `SnapCraft_*.exe` (standalone, no installer needed).
            Frontend is embedded; requires WebView2 Runtime (pre-installed on Win10/11).

            ### Windows (MSIX)
            Download `SnapCraft_*.msix` for Microsoft Store sideloading.
            Requires Windows 10 1809+ with Developer Mode or signed certificate.
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          args: --target ${{ matrix.target }}

      # ---- Upload build artifacts (macOS DMG) ----
      - name: Upload artifacts (macOS DMG)
        if: startsWith(matrix.platform, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      # ---- macOS: 验证公证 staple + 打包 .app 供本地测试 ----
      # 直接用 Actions zip 会破坏 Framework 符号链接,必须用 ditto
      - name: Package & validate .app (macOS)
        if: startsWith(matrix.platform, 'macOS')
        shell: bash
        run: |
          set -e
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/SnapCraft.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "⚠️ SnapCraft.app not found at $APP_PATH"
            echo "  (This is normal if bundle target doesn't include 'app')"
            exit 0
          fi

          echo "=== Validating notarization staple ==="
          # 已公证的包会 staple 成功;未签名/ad-hoc 签名的包会失败(正常,不影响测试)
          if xcrun stapler validate "$APP_PATH" 2>&1; then
            echo "  ✓ Staple validated — notarized build"
          else
            echo "  (staple validation failed — likely unsigned/ad-hoc build, OK for local testing)"
          fi

          echo "=== Packaging .app with ditto (preserves Framework symlinks) ==="
          cd "$(dirname "$APP_PATH")"
          ditto -c -k --keepParent "$(basename "$APP_PATH")" SnapCraft-app.zip
          ls -lh SnapCraft-app.zip
          echo "✓ Created SnapCraft-app.zip"

      - name: Upload .app for testing (macOS)
        if: startsWith(matrix.platform, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-app
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/SnapCraft-app.zip
          if-no-files-found: warn

      # ---- Upload build artifacts (Windows MSI + NSIS) ----
      - name: Upload artifacts (Windows MSI/NSIS)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      # ---- Upload standalone exe (Windows, 免安装测试用) ----
      # 前端已嵌入 exe，只需 WebView2 Runtime 即可运行，无需安装
      - name: Upload standalone exe (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone-exe
          path: |
            src-tauri/target/${{ matrix.target }}/release/snap-craft.exe
          if-no-files-found: warn

      # ---- Build & Upload MSIX (Windows, 微软商城用) ----
      # 使用 @choochmeque/tauri-windows-bundle 从已编译的 exe 生成 MSIX 包
      - name: Build MSIX package (Windows)
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Building MSIX package ==="
          # 安装 msixbundle-cli（若未安装）
          cargo install msixbundle-cli 2>&1 | Out-Null
          # 使用 tauri-windows-bundle 生成 MSIX
          npx @choochmeque/tauri-windows-bundle@latest build --runner pnpm 2>&1
          # 列出 MSIX 产物
          Write-Host "=== MSIX output ==="
          Get-ChildItem -Path "src-tauri/target" -Recurse -Include "*.msix","*.msixbundle" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

      - name: Upload MSIX artifacts (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: |
            src-tauri/target/**/*.msix
            src-tauri/target/**/*.msixbundle
          if-no-files-found: warn

      # ---- Build & Upload portable zip (Windows, 免安装+免 WebView2 引导) ----
      # exe + 所有依赖 DLL + README，打包成 zip 供本地测试
      - name: Build portable zip (Windows)
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Building portable package ==="
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          $portableDir = "src-tauri/target/windows-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          # 拷贝主 exe
          $exe = Join-Path $releaseDir "snap-craft.exe"
          if (Test-Path $exe) {
            Copy-Item -Path $exe -Destination (Join-Path $portableDir "SnapCraft.exe") -Force
            Write-Host "  Copied: snap-craft.exe -> SnapCraft.exe"
          } else {
            Write-Host "  ⚠️ exe not found: $exe"
          }

          # 拷贝所有 DLL（WebView2 runtime 等）
          $dlls = Get-ChildItem -Path $releaseDir -Filter "*.dll" -ErrorAction SilentlyContinue
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination $portableDir -Force
            Write-Host "  Copied DLL: $($dll.Name)"
          }

          # 生成 README
          $readme = @'
          SnapCraft Portable (Unsigned Test Build)
          =======================================

          This is a portable build for local testing - no installer needed.

          Requirements:
            - Windows 10 1809+ (64-bit)
            - WebView2 Runtime (pre-installed on Windows 10/11)
              If missing, download from: https://developer.microsoft.com/microsoft-edge/webview2/

          Usage:
            1. Extract this zip to any folder
            2. Run SnapCraft.exe

          Logs:
            - %LOCALAPPDATA%\com.snap-craft.app\debug.log
            - %APPDATA%\com.snap-craft.app\logs\snapcraft.log

          Note: This build is unsigned. Windows SmartScreen may warn.
          Choose "More info -> Run anyway" to proceed.
          '@
          $readme | Out-File -FilePath (Join-Path $portableDir "README.txt") -Encoding UTF8

          # 压缩
          $zipPath = "src-tauri/target/windows-portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipPath -Force
          Write-Host "  Created: $zipPath"

      - name: Upload portable zip (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            src-tauri/target/windows-portable.zip
          if-no-files-found: warn

  # ============================================================
  # macOS App Store submission (opt-in via vars.ENABLE_APPSTORE)
  # 需要配置 App Store 证书 secrets,默认不启用
  # 产物: .pkg 文件,需通过 Transporter 或 xcrun altool 上传到 App Store Connect
  # ============================================================
  appstore:
    name: App Store Package (macOS)
    needs: [typecheck, cargo-check]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      vars.ENABLE_APPSTORE == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macOS-appstore-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            macOS-appstore-cargo-

      # ---- 导入 App Store 证书(Application + Installer) ----
      - name: Import App Store certificates
        shell: bash
        env:
          APP_CERT: ${{ secrets.APPLE_APP_STORE_CERTIFICATE_BASE64 }}
          APP_CERT_PWD: ${{ secrets.APPLE_APP_STORE_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.APPLE_APP_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_CERT_PWD: ${{ secrets.APPLE_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          if [ -z "$APP_CERT" ] || [ -z "$INSTALLER_CERT" ]; then
            echo "❌ App Store certificates not configured."
            echo "   Required secrets:"
            echo "   - APPLE_APP_STORE_CERTIFICATE_BASE64 (3rd Party Mac Developer Application .p12)"
            echo "   - APPLE_APP_STORE_CERTIFICATE_PASSWORD"
            echo "   - APPLE_APP_STORE_INSTALLER_CERTIFICATE_BASE64 (3rd Party Mac Developer Installer .p12)"
            echo "   - APPLE_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD"
            exit 1
          fi

          # 创建临时 keychain
          KEYCHAIN="appstore-build.keychain-db"
          KEYCHAIN_PWD="appstore-$(date +%s)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          # 导入 Application 证书(签名 .app)
          echo "$APP_CERT" | base64 --decode > app-cert.p12
          security import app-cert.p12 -k "$KEYCHAIN" -P "$APP_CERT_PWD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f app-cert.p12

          # 导入 Installer 证书(签名 .pkg)
          echo "$INSTALLER_CERT" | base64 --decode > installer-cert.p12
          security import installer-cert.p12 -k "$KEYCHAIN" -P "$INSTALLER_CERT_PWD" -T /usr/bin/productbuild
          rm -f installer-cert.p12

          # 设置 keychain 搜索路径 + ACL
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p macpkginstaller "$KEYCHAIN"

      # ---- 构建 .app(用 App Store Application 证书签名) ----
      - name: Build .app for App Store
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_APP_STORE_SIGNING_IDENTITY }}
        run: |
          set -e
          echo "Building .app with signing identity: $APPLE_SIGNING_IDENTITY"
          pnpm tauri build --target aarch64-apple-darwin --bundles app

      # ---- productbuild 生成 App Store .pkg ----
      - name: Build App Store .pkg
        shell: bash
        env:
          INSTALLER_IDENTITY: ${{ secrets.APPLE_APP_STORE_INSTALLER_IDENTITY }}
        run: |
          set -e
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SnapCraft.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ SnapCraft.app not found"
            exit 1
          fi

          echo "=== Checking .app code signature ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1 || true

          echo "=== Building .pkg with productbuild ==="
          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            SnapCraft-AppStore.pkg

          echo "=== Verifying .pkg signature ==="
          pkgutil --check-signature SnapCraft-AppStore.pkg
          ls -lh SnapCraft-AppStore.pkg
          echo "✓ Created SnapCraft-AppStore.pkg"

      - name: Upload App Store .pkg
        uses: actions/upload-artifact@v4
        with:
          name: macos-appstore-pkg
          path: SnapCraft-AppStore.pkg
          if-no-files-found: error
