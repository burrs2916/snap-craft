name: CI / Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # TypeScript type-check (frontend quality gate)
  # ============================================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsc type-check
        run: pnpm exec tsc --noEmit

  # ============================================================
  # Rust check (backend quality gate)
  # ============================================================
  cargo-check:
    name: Cargo Check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  # ============================================================
  # Tauri Build Matrix (macOS / Windows)
  # ============================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: [typecheck, cargo-check]
    permissions:
      contents: write
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- Node.js + pnpm ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ---- Rust ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache Cargo (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ---- Build Tauri App ----
      # macOS: tauri-action builds and creates DMG, then we fix signing below
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'SnapCraft v__VERSION__'
          releaseBody: |
            ## SnapCraft v__VERSION__

            ### macOS (Apple Silicon)
            Download `SnapCraft_*.dmg`, double-click to mount, then drag
            **SnapCraft** into the Applications folder.

            由于应用使用 ad-hoc 签名（无 Apple 开发者证书），首次打开可能被
            Gatekeeper 拦截。请执行以下命令解除限制：
            ```bash
            sudo xattr -dr com.apple.quarantine /Applications/SnapCraft.app
            ```
            然后双击打开。首次截图时会自动弹出屏幕录制权限请求，点击「允许」即可。

            ### Windows
            Download `SnapCraft_*.msi` and double-click to install.
            SmartScreen may warn - choose "More info -> Run anyway".
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          args: --target ${{ matrix.target }}

      # ---- macOS: fix Gatekeeper "damaged" / forbidden icon issue ----
      # 问题根因：tauri-action 打包的 .app ad-hoc 签名不完整，
      # 加上浏览器下载会打 quarantine 标记，Gatekeeper 直接显示"已损坏"或禁止图标。
      # 修复：对 .app 做完整的 ad-hoc 签名（--options runtime 模拟 hardened runtime），
      # 然后重新打 DMG，让 DMG 内的 .app 就是签名完整的版本。
      - name: Fix macOS Gatekeeper "damaged" issue
        if: startsWith(matrix.platform, 'macOS')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$BUNDLE_DIR/macos/SnapCraft.app"
          OLD_DMG="$BUNDLE_DIR/dmg/SnapCraft_0.1.0_aarch64.dmg"
          NEW_DMG="$BUNDLE_DIR/dmg/SnapCraft-fixed.dmg"

          echo "=== Before fix ==="
          xattr -l "$APP" || true
          codesign -dv "$APP" 2>&1 || true

          # 1. 去掉 .app 的所有扩展属性
          xattr -cr "$APP"

          # 2. 重新做 ad-hoc 签名（--deep 递归签名所有内部二进制）
          #    不加 --options runtime，因为 hardened runtime 对 ad-hoc 签名反而会导致权限问题
          codesign --force --deep --sign - "$APP"

          # 3. 验证签名完整性
          echo "=== After fix ==="
          codesign --verify --strict --verbose "$APP" 2>&1
          xattr -l "$APP" || echo "(no extended attributes - good)"

          # 4. 重新打 DMG（先删旧的，确保干净）
          echo "=== Rebuilding DMG ==="
          rm -f "$OLD_DMG" "$NEW_DMG"
          hdiutil create -volname "SnapCraft" -srcfolder "$APP" -ov -format UDZO "$NEW_DMG"

          # 5. 去掉 DMG 的扩展属性
          xattr -cr "$NEW_DMG"

          # 6. 重命名为期望的文件名
          mv "$NEW_DMG" "$OLD_DMG"
          echo "Replaced DMG at $OLD_DMG"

          # 7. 如果在 release 模式（tag push），替换 release asset
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Updating release assets for tag $TAG"
            gh release delete-asset "$TAG" "SnapCraft_0.1.0_aarch64.dmg" --yes 2>/dev/null || true
            gh release upload "$TAG" "$OLD_DMG" --clobber
          fi

      # ---- Upload build artifacts ----
      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
