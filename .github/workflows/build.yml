name: CI / Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # TypeScript type-check (frontend quality gate)
  # ============================================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsc type-check
        run: pnpm exec tsc --noEmit

  # ============================================================
  # Rust check (backend quality gate)
  # ============================================================
  cargo-check:
    name: Cargo Check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check
        run: cargo check --locked
        working-directory: src-tauri

      - name: Cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

  # ============================================================
  # Tauri Build Matrix (macOS / Windows)
  #
  # macOS 签名修复 (2026-07-18):
  #   不再用 tauri-apps/tauri-action 内部的 `security import` 来导入证书
  #   (该路径在 CI 无头环境脆弱, 会报 "One or more parameters passed to a
  #   function were not valid")。改为: 手动导入证书到专用 keychain +
  #   直接 `pnpm tauri build`。Release 改为由独立的 release job 用
  #   softprops/action-gh-release@v2 发布。
  #   Windows 仍保留 tauri-action (仅 MSI/NSIS 签名, 未报证书错误)。
  # ============================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: [typecheck, cargo-check]
    permissions:
      contents: write
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- Node.js + pnpm ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ---- Rust ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache Cargo (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ==========================================================
      # macOS: 手动导入 Apple 证书到专用 keychain
      # 仅当配置了 APPLE_CERTIFICATE_BASE64 时运行。
      # 绕过 tauri-action 脆弱的自动 security import。
      # ==========================================================
      - name: Import Apple certificate (macOS)
        if: ${{ startsWith(matrix.platform, 'macOS') }}
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN: ${{ runner.temp }}/build.keychain-db
        run: |
          set -euo pipefail

          # No Apple signing certificate configured -> skip import, let tauri ad-hoc sign.
          # (step-level `if` cannot reference the `secrets` context, so the cert-presence
          #  check lives here instead of in the `if:` condition)
          if [ -z "${CERT_BASE64:-}" ]; then
            echo "APPLE_CERTIFICATE_BASE64 not set - skipping certificate import; build will use ad-hoc signing."
            printf 'RESOLVED_SIGNING_IDENTITY=\n' >> "$GITHUB_ENV"
            exit 0
          fi

          # FIX: fail fast on empty password - never hand an empty -P to `security import`
          # (empty password is the #1 cause of "One or more parameters passed to a function were not valid")
          : "${CERT_PWD:?APPLE_CERTIFICATE_PASSWORD secret is empty - cannot import a p12 that contains a private key}"

          # Dedicated, randomly-generated keychain password, decoupled from the p12 password.
          KEYCHAIN_PWD="$(openssl rand -base64 24)"

          CERT_P12="$RUNNER_TEMP/build_certificate.p12"

          echo "=== Decoding base64 -> p12 ==="
          # Single base64 decode only (printf avoids trailing-newline/interpretation issues);
          # if the Secret is double-encoded or corrupt, the openssl validation below will catch it.
          printf '%s' "$CERT_BASE64" | base64 --decode -o "$CERT_P12"

          echo "=== Validating p12 (cert + private key present, password correct) ==="
          if ! openssl pkcs12 -info -in "$CERT_P12" -passin "pass:$CERT_PWD" -nokeys -passout pass: 2>/dev/null | grep -q "BEGIN CERTIFICATE"; then
            echo "❌ APPLE_CERTIFICATE_BASE64 不是合法、可被密码解开的 PKCS#12 (.p12) 证书包。"
            echo "   常见原因: 误存了 Apple 下载的 .cer(仅公钥)、PEM 文本、二次 base64 编码损坏, 或密码不符。"
            echo "   请用本地脚本先自查: ./scripts/validate-apple-cert.sh build_certificate.p12 '<p12-password>'"
            exit 1
          fi
          if ! openssl pkcs12 -info -in "$CERT_P12" -passin "pass:$CERT_PWD" -nocerts -passout pass: 2>/dev/null | grep -q "PRIVATE KEY"; then
            echo "❌ p12 内未包含私钥。codesign 必须要有私钥才能签名。"
            echo "   请从 Keychain Access 重新导出: 选中证书(展开显示私钥) -> 右键导出 .p12 -> 设置密码。"
            exit 1
          fi
          echo "  ✓ p12 校验通过 (含证书 + 私钥)"

          echo "=== Creating dedicated keychain ==="
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          echo "=== Importing p12 (auto-detect format; DO NOT use -t cert on a cert+key aggregate) ==="
          # FIX: dropped `-t cert -f pkcs12`. A .p12 carries BOTH cert and private key;
          # forcing `-t cert` makes `security` mis-type it and report
          # "One or more parameters passed to a function were not valid".
          security import "$CERT_P12" -P "$CERT_PWD" -A -k "$KEYCHAIN"

          echo "=== Registering keychain in user search list (guard against missing login.keychain-db) ==="
          # Fresh macOS runners may not yet have a login.keychain-db; referencing a
          # non-existent keychain in `-s` makes `security` error out.
          SEARCH_LIST="$KEYCHAIN"
          if [ -f "$HOME/Library/Keychains/login.keychain-db" ] || [ -f "$HOME/Library/Keychains/login.keychain" ]; then
            SEARCH_LIST="$KEYCHAIN login.keychain-db"
          fi
          security list-keychains -d user -s $SEARCH_LIST

          echo "=== Granting codesign headless access to private key (CRITICAL) ==="
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          echo "=== Resolving signing identity ==="
          RESOLVED=""
          RESOLVED=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -n1 | sed -E 's/.*\) +([A-Fa-f0-9]+) +"(.*)"/\2/') || true
          if [ -z "$RESOLVED" ]; then
            echo "  (no 'Developer ID Application' identity — falling back to first available codesigning identity)"
            RESOLVED=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -n1 | sed -E 's/.*\) +([A-Fa-f0-9]+) +"(.*)"/\2/') || true
          fi
          # Safe GITHUB_ENV write (printf, no newline-injection risk)
          printf 'RESOLVED_SIGNING_IDENTITY=%s\n' "$RESOLVED" >> "$GITHUB_ENV"
          if [ -n "$RESOLVED" ]; then
            echo "  ✓ Signing identity: $RESOLVED"
          else
            echo "  (no codesigning identity found — build will fall back to ad-hoc signing)"
          fi

      # ==========================================================
      # macOS: 直接构建 (签名走自建 keychain, 不再依赖 tauri-action)
      # 当 APPLE_CERTIFICATE_BASE64 缺失时 RESOLVED_SIGNING_IDENTITY 为空,
      # tauri-bundler 自动 ad-hoc 签名, 保证出包不崩。
      # ==========================================================
      - name: Build Tauri App (macOS)
        if: ${{ startsWith(matrix.platform, 'macOS') }}
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "Building for aarch64-apple-darwin (signing identity: '${APPLE_SIGNING_IDENTITY:-<ad-hoc>}')"
          pnpm tauri build --target aarch64-apple-darwin

      # ==========================================================
      # Windows: 保留 tauri-action (仅 MSI/NSIS 签名, 未报证书错误)
      # 已禁用其 Release 创建 (改由独立 release job 用 action-gh-release 发布)。
      # ==========================================================
      - name: Build Tauri App (Windows)
        if: ${{ matrix.platform == 'Windows' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}

      # ---- Upload build artifacts (macOS DMG) ----
      - name: Upload artifacts (macOS DMG)
        if: startsWith(matrix.platform, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      # ---- macOS: 验证公证 staple + 打包 .app 供本地测试 ----
      # 直接用 Actions zip 会破坏 Framework 符号链接,必须用 ditto
      - name: Package & validate .app (macOS)
        if: startsWith(matrix.platform, 'macOS')
        shell: bash
        run: |
          set -e
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/SnapCraft.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "⚠️ SnapCraft.app not found at $APP_PATH"
            echo "  (This is normal if bundle target doesn't include 'app')"
            exit 0
          fi

          echo "=== Validating notarization staple ==="
          # 已公证的包会 staple 成功;未签名/ad-hoc 签名的包会失败(正常,不影响测试)
          if xcrun stapler validate "$APP_PATH" 2>&1; then
            echo "  ✓ Staple validated — notarized build"
          else
            echo "  (staple validation failed — likely unsigned/ad-hoc build, OK for local testing)"
          fi

          echo "=== Packaging .app with ditto (preserves Framework symlinks) ==="
          cd "$(dirname "$APP_PATH")"
          ditto -c -k --keepParent "$(basename "$APP_PATH")" SnapCraft-app.zip
          ls -lh SnapCraft-app.zip
          echo "✓ Created SnapCraft-app.zip"

      - name: Upload .app for testing (macOS)
        if: startsWith(matrix.platform, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-app
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/SnapCraft-app.zip
          if-no-files-found: warn

      # ---- Upload build artifacts (Windows MSI + NSIS) ----
      - name: Upload artifacts (Windows MSI/NSIS)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      # ---- Upload standalone exe (Windows, 免安装测试用) ----
      # 前端已嵌入 exe，只需 WebView2 Runtime 即可运行，无需安装
      - name: Upload standalone exe (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone-exe
          path: |
            src-tauri/target/${{ matrix.target }}/release/snap-craft.exe
          if-no-files-found: warn

      # ---- Build & Upload MSIX (Windows, 微软商城用) ----
      # 使用 @choochmeque/tauri-windows-bundle 从已编译的 exe 生成 MSIX 包
      - name: Build MSIX package (Windows)
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Building MSIX package ==="
          # 安装 msixbundle-cli（若未安装）
          cargo install msixbundle-cli 2>&1 | Out-Null
          # 使用 tauri-windows-bundle 生成 MSIX
          npx @choochmeque/tauri-windows-bundle@latest build --runner pnpm 2>&1
          # 列出 MSIX 产物
          Write-Host "=== MSIX output ==="
          Get-ChildItem -Path "src-tauri/target" -Recurse -Include "*.msix","*.msixbundle" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

      - name: Upload MSIX artifacts (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: |
            src-tauri/target/**/*.msix
            src-tauri/target/**/*.msixbundle
          if-no-files-found: warn

      # ---- Build & Upload portable zip (Windows, 免安装+免 WebView2 引导) ----
      # exe + 所有依赖 DLL + README，打包成 zip 供本地测试
      - name: Build portable zip (Windows)
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Building portable package ==="
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          $portableDir = "src-tauri/target/windows-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          # 拷贝主 exe
          $exe = Join-Path $releaseDir "snap-craft.exe"
          if (Test-Path $exe) {
            Copy-Item -Path $exe -Destination (Join-Path $portableDir "SnapCraft.exe") -Force
            Write-Host "  Copied: snap-craft.exe -> SnapCraft.exe"
          } else {
            Write-Host "  ⚠️ exe not found: $exe"
          }

          # 拷贝所有 DLL（WebView2 runtime 等）
          $dlls = Get-ChildItem -Path $releaseDir -Filter "*.dll" -ErrorAction SilentlyContinue
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination $portableDir -Force
            Write-Host "  Copied DLL: $($dll.Name)"
          }

          # 生成 README
          $readme = @'
          SnapCraft Portable (Unsigned Test Build)
          =======================================

          This is a portable build for local testing - no installer needed.

          Requirements:
            - Windows 10 1809+ (64-bit)
            - WebView2 Runtime (pre-installed on Windows 10/11)
              If missing, download from: https://developer.microsoft.com/microsoft-edge/webview2/

          Usage:
            1. Extract this zip to any folder
            2. Run SnapCraft.exe

          Logs:
            - %LOCALAPPDATA%\com.snap-craft.app\debug.log
            - %APPDATA%\com.snap-craft.app\logs\snapcraft.log

          Note: This build is unsigned. Windows SmartScreen may warn.
          Choose "More info -> Run anyway" to proceed.
          '@
          $readme | Out-File -FilePath (Join-Path $portableDir "README.txt") -Encoding UTF8

          # 压缩
          $zipPath = "src-tauri/target/windows-portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipPath -Force
          Write-Host "  Created: $zipPath"

      - name: Upload portable zip (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            src-tauri/target/windows-portable.zip
          if-no-files-found: warn

  # ============================================================
  # Publish GitHub Release (only on tag push)
  # 收集 build job 的全部产物, 用 softprops/action-gh-release 发布。
  # 替代原先 tauri-action 内置的 Release 创建 (macOS 已不再用 tauri-action)。
  # ============================================================
  release:
    name: Publish GitHub Release
    needs: [build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: .
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
          body: |
            ## SnapCraft ${{ github.ref_name }}

            ### macOS (Apple Silicon)
            Download `SnapCraft_*.dmg`, double-click to mount, then drag
            **SnapCraft** into the Applications folder.

            如果应用使用了 Apple Developer ID 签名 + 公证（CI 配置了证书时），
            Gatekeeper 不会拦截，可直接双击打开。否则使用 ad-hoc 签名，首次
            打开需执行：
            ```bash
            sudo xattr -dr com.apple.quarantine /Applications/SnapCraft.app
            ```
            首次截图时会自动弹出屏幕录制权限请求，点击「允许」即可。

            ### Windows (Installer)
            Download `SnapCraft_*.msi` and double-click to install.
            SmartScreen may warn - choose "More info -> Run anyway".

            ### Windows (Standalone EXE)
            Download `SnapCraft_*.exe` (standalone, no installer needed).
            Frontend is embedded; requires WebView2 Runtime (pre-installed on Win10/11).

            ### Windows (MSIX)
            Download `SnapCraft_*.msix` for Microsoft Store sideloading.
            Requires Windows 10 1809+ with Developer Mode or signed certificate.
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.app.zip
            src-tauri/target/**/release/bundle/**/*.msix
            src-tauri/target/**/release/bundle/**/*.msixbundle

  # ============================================================
  # macOS App Store submission (opt-in via vars.ENABLE_APPSTORE)
  # 需要配置 App Store 证书 secrets,默认不启用
  # 产物: .pkg 文件,需通过 Transporter 或 xcrun altool 上传到 App Store Connect
  # ============================================================
  appstore:
    name: App Store Package (macOS)
    needs: [typecheck, cargo-check]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      vars.ENABLE_APPSTORE == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macOS-appstore-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            macOS-appstore-cargo-

      # ---- 导入 App Store 证书(Application + Installer) ----
      - name: Import App Store certificates
        shell: bash
        env:
          APP_CERT: ${{ secrets.APPLE_APP_STORE_CERTIFICATE_BASE64 }}
          APP_CERT_PWD: ${{ secrets.APPLE_APP_STORE_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.APPLE_APP_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_CERT_PWD: ${{ secrets.APPLE_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          if [ -z "$APP_CERT" ] || [ -z "$INSTALLER_CERT" ]; then
            echo "❌ App Store certificates not configured."
            echo "   Required secrets:"
            echo "   - APPLE_APP_STORE_CERTIFICATE_BASE64 (3rd Party Mac Developer Application .p12)"
            echo "   - APPLE_APP_STORE_CERTIFICATE_PASSWORD"
            echo "   - APPLE_APP_STORE_INSTALLER_CERTIFICATE_BASE64 (3rd Party Mac Developer Installer .p12)"
            echo "   - APPLE_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD"
            exit 1
          fi

          # 创建临时 keychain
          KEYCHAIN="appstore-build.keychain-db"
          KEYCHAIN_PWD="appstore-$(date +%s)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          # 导入 Application 证书(签名 .app)
          echo "$APP_CERT" | base64 --decode > app-cert.p12
          security import app-cert.p12 -k "$KEYCHAIN" -P "$APP_CERT_PWD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f app-cert.p12

          # 导入 Installer 证书(签名 .pkg)
          echo "$INSTALLER_CERT" | base64 --decode > installer-cert.p12
          security import installer-cert.p12 -k "$KEYCHAIN" -P "$INSTALLER_CERT_PWD" -T /usr/bin/productbuild
          rm -f installer-cert.p12

          # 设置 keychain 搜索路径 + ACL
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p macpkginstaller "$KEYCHAIN"

      # ---- 构建 .app(用 App Store Application 证书签名) ----
      - name: Build .app for App Store
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_APP_STORE_SIGNING_IDENTITY }}
        run: |
          set -e
          echo "Building .app with signing identity: $APPLE_SIGNING_IDENTITY"
          pnpm tauri build --target aarch64-apple-darwin --bundles app

      # ---- productbuild 生成 App Store .pkg ----
      - name: Build App Store .pkg
        shell: bash
        env:
          INSTALLER_IDENTITY: ${{ secrets.APPLE_APP_STORE_INSTALLER_IDENTITY }}
        run: |
          set -e
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SnapCraft.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ SnapCraft.app not found"
            exit 1
          fi

          echo "=== Checking .app code signature ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1 || true

          echo "=== Building .pkg with productbuild ==="
          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            SnapCraft-AppStore.pkg

          echo "=== Verifying .pkg signature ==="
          pkgutil --check-signature SnapCraft-AppStore.pkg
          ls -lh SnapCraft-AppStore.pkg
          echo "✓ Created SnapCraft-AppStore.pkg"

      - name: Upload App Store .pkg
        uses: actions/upload-artifact@v4
        with:
          name: macos-appstore-pkg
          path: SnapCraft-AppStore.pkg
          if-no-files-found: error
